<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brium Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #222; }
  .container { max-width: 780px; margin: 0 auto; padding: 32px 16px; }
  .logo { font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; }
  .logo span { color: #6366f1; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 24px; border-bottom: 2px solid #e5e5e5; }
  .tab { padding: 8px 20px; cursor: pointer; border: none; background: none; font-size: 0.9rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 500; }
  .tab.active { color: #6366f1; border-bottom-color: #6366f1; }
  .panel { display: none; }
  .panel.active { display: block; }
  input[type=text], input[type=number] { width: 100%; padding: 10px 14px; font-size: 0.95rem; border: 2px solid #ddd; border-radius: 8px; outline: none; }
  input[type=text]:focus, input[type=number]:focus { border-color: #6366f1; }
  button { padding: 10px 22px; font-size: 0.9rem; background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  button:hover { background: #4f46e5; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; }
  .stats { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
  .result { background: #fff; padding: 14px 16px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .result .title { font-size: 1rem; font-weight: 600; color: #6366f1; }
  .result .url { font-size: 0.8rem; color: #16a34a; margin: 2px 0 4px; }
  .result .score { font-size: 0.75rem; color: #999; }
  .empty, .info { text-align: center; padding: 40px 20px; color: #999; }
  .error { color: #dc2626; text-align: center; padding: 20px; }
  .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 16px; }
  .card h3 { font-size: 1rem; margin-bottom: 12px; color: #444; }
  .card label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 4px; }
  .card .field { margin-bottom: 12px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-box { background: #f8f8ff; padding: 14px; border-radius: 8px; text-align: center; }
  .stat-box .val { font-size: 1.6rem; font-weight: 700; color: #6366f1; }
  .stat-box .label { font-size: 0.8rem; color: #888; margin-top: 2px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #222; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .crawl-progress { margin-top: 10px; font-size: 0.85rem; color: #666; }
  .crawl-progress .bar { height: 6px; background: #e5e5e5; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .crawl-progress .bar-fill { height: 100%; background: #6366f1; border-radius: 3px; width: 0%; transition: width .5s; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Brium<span>.</span></div>

  <div class="tabs">
    <button class="tab active" data-panel="search">Search</button>
    <button class="tab" data-panel="crawl">Crawl</button>
    <button class="tab" data-panel="status">Status</button>
  </div>

  <div id="panel-search" class="panel active">
    <form id="searchForm" class="search-row">
      <input type="text" id="q" placeholder="Search..." autofocus>
      <button type="submit">Search</button>
    </form>
    <div id="stats" class="stats"></div>
    <div id="results"></div>
  </div>

  <div id="panel-crawl" class="panel">
    <div class="card">
      <h3>Start a Crawl</h3>
      <div class="field">
        <label>Seed URLs (one per line)</label>
        <textarea id="seeds" rows="4" style="width:100%;padding:10px 14px;font-size:.9rem;border:2px solid #ddd;border-radius:8px;outline:none;resize:vertical;font-family:inherit">https://example.com</textarea>
      </div>
      <div class="field">
        <label>Max pages</label>
        <input type="number" id="maxPages" value="50" min="1" style="width:120px">
      </div>
      <button id="crawlBtn">Start Crawl</button>
      <div id="crawlProgress" class="crawl-progress" style="display:none">
        <div id="crawlStatus">Crawling...</div>
        <div class="bar"><div id="crawlBar" class="bar-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="panel-status" class="panel">
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="val" id="statDocs">0</div><div class="label">Docs Indexed</div></div>
        <div class="stat-box"><div class="val" id="statTerms">0</div><div class="label">Total Tokens</div></div>
        <div class="stat-box"><div class="val" id="statCrawl">Idle</div><div class="label">Crawl Status</div></div>
        <div class="stat-box"><div class="val" id="statPages">0</div><div class="label">Pages Crawled</div></div>
      </div>
      <button id="refreshStatus" style="margin-top:14px;width:100%">Refresh</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
// --- Tab switching ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// --- Toast ---
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// --- Search ---
document.getElementById('searchForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const resDiv = document.getElementById('results');
  const statsDiv = document.getElementById('stats');
  resDiv.innerHTML = '<div class="empty">Searching...</div>';
  statsDiv.textContent = '';
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&top_k=20`);
    const data = await res.json();
    if (!res.ok) { resDiv.innerHTML = `<div class="error">${data.error || 'Error'}</div>`; return; }
    if (data.results.length === 0) { resDiv.innerHTML = '<div class="empty">No results</div>'; statsDiv.textContent = '0 results'; return; }
    statsDiv.textContent = `${data.total} results for "${data.query}"`;
    resDiv.innerHTML = data.results.map(r =>
      `<div class="result"><div class="title"><a href="${r.url}" target="_blank">${r.title || r.url}</a></div><div class="url">${r.url}</div><div class="score">score: ${r.score.toFixed(4)}</div></div>`
    ).join('');
  } catch (err) { resDiv.innerHTML = `<div class="error">Request failed: ${err.message}</div>`; }
});

// --- Crawl ---
document.getElementById('crawlBtn').addEventListener('click', async () => {
  const seeds = document.getElementById('seeds').value.trim().split('\n').filter(Boolean);
  const maxPages = parseInt(document.getElementById('maxPages').value) || 50;
  const btn = document.getElementById('crawlBtn');
  const prog = document.getElementById('crawlProgress');
  const statusEl = document.getElementById('crawlStatus');
  const bar = document.getElementById('crawlBar');
  btn.disabled = true; prog.style.display = 'block'; statusEl.textContent = 'Starting crawl...'; bar.style.width = '0%';
  try {
    const res = await fetch('/crawl', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ seeds, max_pages: maxPages }) });
    const data = await res.json();
    if (!res.ok) { toast('Crawl error: ' + (data.error || '')); btn.disabled = false; return; }
    toast('Crawl started');
    // Poll status
    const poll = setInterval(async () => {
      const sr = await fetch('/status');
      const s = await sr.json();
      const pct = maxPages > 0 ? Math.min(100, (s.crawl_pages / maxPages) * 100) : 0;
      bar.style.width = pct + '%';
      statusEl.textContent = s.crawl_running ? `Crawling... ${s.crawl_pages} pages` : `Done — ${s.crawl_pages} pages`;
      if (!s.crawl_running) { clearInterval(poll); btn.disabled = false; prog.style.display = 'none'; toast('Crawl finished'); }
    }, 2000);
  } catch (err) { toast('Crawl failed: ' + err.message); btn.disabled = false; }
});

// --- Status ---
async function refreshStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    document.getElementById('statDocs').textContent = data.docs_indexed;
    document.getElementById('statTerms').textContent = data.total_terms < 1000 ? data.total_terms : (data.total_terms/1000).toFixed(1) + 'k';
    document.getElementById('statCrawl').textContent = data.crawl_running ? 'Running' : 'Idle';
    document.getElementById('statPages').textContent = data.crawl_pages;
  } catch { toast('Failed to load status'); }
}
document.getElementById('refreshStatus').addEventListener('click', refreshStatus);

// Auto-refresh status on tab switch
document.querySelector('[data-panel="status"]').addEventListener('click', refreshStatus);

// Initial query from URL
const urlParams = new URLSearchParams(window.location.search);
const initialQ = urlParams.get('q');
if (initialQ) { document.getElementById('q').value = initialQ; document.getElementById('searchForm').dispatchEvent(new Event('submit')); }

// Load status on first visit
setTimeout(refreshStatus, 500);
</script>
</body>
</html>
