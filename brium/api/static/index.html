<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brium Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #222; }
  .container { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
  .logo { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
  .logo span { color: #6366f1; }
  .sub { color: #666; margin-bottom: 24px; }
  form { display: flex; gap: 8px; margin-bottom: 32px; }
  input[type=text] { flex: 1; padding: 12px 16px; font-size: 1rem; border: 2px solid #ddd; border-radius: 8px; outline: none; }
  input[type=text]:focus { border-color: #6366f1; }
  button { padding: 12px 24px; font-size: 1rem; background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  button:hover { background: #4f46e5; }
  .stats { font-size: 0.85rem; color: #888; margin-bottom: 16px; }
  .result { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .result .title { font-size: 1.05rem; font-weight: 600; color: #6366f1; }
  .result .url { font-size: 0.8rem; color: #16a34a; margin: 2px 0 4px; }
  .result .score { font-size: 0.75rem; color: #999; }
  .empty { text-align: center; padding: 40px; color: #999; }
  .error { color: #dc2626; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Brium<span>.</span></div>
  <div class="sub">search engine</div>
  <form id="searchForm">
    <input type="text" id="q" name="q" placeholder="Search..." autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="stats" class="stats"></div>
  <div id="results"></div>
</div>
<script>
const form = document.getElementById('searchForm');
const qInput = document.getElementById('q');
const resultsDiv = document.getElementById('results');
const statsDiv = document.getElementById('stats');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (!q) return;
  resultsDiv.innerHTML = '<div class="empty">Searching...</div>';
  statsDiv.textContent = '';
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&top_k=20`);
    const data = await res.json();
    if (!res.ok) { resultsDiv.innerHTML = `<div class="error">${data.error || 'Error'}</div>`; return; }
    if (data.results.length === 0) {
      resultsDiv.innerHTML = '<div class="empty">No results found</div>';
      statsDiv.textContent = '0 results';
      return;
    }
    statsDiv.textContent = `${data.total} results for "${data.query}"`;
    resultsDiv.innerHTML = data.results.map(r => `
      <div class="result">
        <div class="title"><a href="${r.url}" target="_blank">${r.title || r.url}</a></div>
        <div class="url">${r.url}</div>
        <div class="score">score: ${r.score.toFixed(4)}</div>
      </div>
    `).join('');
  } catch (err) {
    resultsDiv.innerHTML = `<div class="error">Request failed: ${err.message}</div>`;
  }
});

// Run initial query from URL param
const urlParams = new URLSearchParams(window.location.search);
const initialQ = urlParams.get('q');
if (initialQ) { qInput.value = initialQ; form.dispatchEvent(new Event('submit')); }
</script>
</body>
</html>
