<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #222; }
  .hero { text-align: center; padding: 140px 16px 40px; transition: padding .3s; }
  .hero.has-results { padding: 40px 16px 20px; }
  .logo { font-size: 3.5rem; font-weight: 700; letter-spacing: -2px; }
  .logo span { color: #6366f1; }
  .search-wrap { max-width: 600px; margin: 24px auto 0; position: relative; }
  .search-wrap input { width: 100%; padding: 14px 18px; font-size: 1.05rem; border: 2px solid #e5e5e5; border-radius: 28px; outline: none; transition: box-shadow .2s; }
  .search-wrap input:focus { border-color: #6366f1; box-shadow: 0 1px 6px rgba(99,102,241,.2); }
  .search-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 8px 20px; background: #6366f1; color: #fff; border: none; border-radius: 24px; cursor: pointer; font-weight: 600; font-size: .9rem; }
  .search-wrap button:hover { background: #4f46e5; }
  .results { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }
  .result { padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
  .result .url { font-size: .82rem; color: #16a34a; margin-bottom: 2px; }
  .result .title { font-size: 1.05rem; font-weight: 500; }
  .result .title a { color: #6366f1; text-decoration: none; }
  .result .title a:hover { text-decoration: underline; }
  .result .snippet { font-size: .88rem; color: #555; margin-top: 4px; line-height: 1.4; }
  .result .meta { font-size: .75rem; color: #999; margin-top: 4px; }
  .empty { text-align: center; padding: 60px 16px; color: #999; font-size: .95rem; }
  .empty .hint { font-size: .82rem; margin-top: 8px; color: #bbb; }
  .crawling { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #f0f0ff; color: #6366f1; padding: 8px 18px; border-radius: 20px; font-size: .82rem; font-weight: 500; display: none; }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="logo">Brium<span>.</span></div>
  <div class="search-wrap">
    <form id="f" autocomplete="off">
      <input type="text" id="q" name="q" placeholder="Search anything...">
      <button type="submit">Search</button>
    </form>
  </div>
</div>
<div class="results" id="results"></div>
<div class="crawling" id="crawling">Crawling to find your answer…</div>

<script>
const f = document.getElementById('f');
const q = document.getElementById('q');
const r = document.getElementById('results');
const hero = document.getElementById('hero');
const crawling = document.getElementById('crawling');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const query = q.value.trim();
  if (!query) return;
  hero.classList.add('has-results');
  r.innerHTML = '<div class="empty">Searching…</div>';
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(query)}&top_k=20`);
    const d = await res.json();
    crawling.style.display = d.crawling ? 'block' : 'none';
    if (!res.ok) { r.innerHTML = `<div class="empty">Error</div>`; return; }
    if (d.results.length === 0) {
      r.innerHTML = `<div class="empty">No results yet<div class="hint">Crawling the web for "${query}" — results will appear shortly</div></div>`;
      _poll(query);
      return;
    }
    r.innerHTML = d.results.map(item =>
      `<div class="result">
        <div class="url">${item.url}</div>
        <div class="title"><a href="${item.url}" target="_blank">${item.title || item.url}</a></div>
        <div class="snippet">${item.snippet || ''}</div>
        <div class="meta">score ${item.score.toFixed(3)}</div>
      </div>`
    ).join('');
    if (d.crawling) _poll(query);
  } catch (err) { r.innerHTML = `<div class="empty">Request failed</div>`; }
});

let pollTimer;
function _poll(query) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    const res = await fetch(`/search?q=${encodeURIComponent(query)}&top_k=20`);
    const d = await res.json();
    crawling.style.display = d.crawling ? 'block' : 'none';
    if (d.results.length > 0) {
      crawling.style.display = 'none';
      r.innerHTML = d.results.map(item =>
        `<div class="result">
          <div class="url">${item.url}</div>
          <div class="title"><a href="${item.url}" target="_blank">${item.title || item.url}</a></div>
          <div class="meta">score ${item.score.toFixed(3)}</div>
        </div>`
      ).join('');
      return;
    }
    _poll(query);
  }, 3000);
}

const urlParams = new URLSearchParams(window.location.search);
const initialQ = urlParams.get('q');
if (initialQ) { q.value = initialQ; f.dispatchEvent(new Event('submit')); }
</script>
</body>
</html>
