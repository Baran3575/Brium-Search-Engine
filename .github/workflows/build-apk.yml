name: Build Brium APK (arm64-v8a)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore brium.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias brium \
            -storepass android -keypass android \
            -dname "CN=Brium, OU=Dev, O=Brium, L=, ST=, C="

      - name: Build arm64-v8a release APK
        working-directory: android
        run: gradle assembleRelease
        env:
          ANDROID_HOME: $ANDROID_HOME
          KEYSTORE_PATH: ${{ github.workspace }}/brium.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: brium
          KEY_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brium-arm64-v8a-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK mapping (debug symbols)
        uses: actions/upload-artifact@v4
        with:
          name: brium-arm64-v8a-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
          if-no-files-found: ignore
